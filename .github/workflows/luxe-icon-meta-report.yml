name: Luxe Icon Meta Ads - Relatorio Semanal

on:
  workflow_dispatch:       # acionado pelo dispatcher-segunda.yml ou manualmente

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias

      - name: Gerar relatorio Meta Ads Luxe Icon LTD
        env:
          META_TOKEN: ${{ secrets.LUXE_ICON_META_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ACCOUNT_ID: "act_412122005210742"
          CLIENT_NAME: "Luxe Icon LTD"
          CURRENCY: "EUR"
          BUDGET_MONTHLY: "3000"
          REPORT_DIR: "reports/data-know/luxe-icon"
          USE_MONTH_FOLDER: "false"
        run: python scripts/meta_report_ai.py