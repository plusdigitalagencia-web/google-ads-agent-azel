name: Luxe Icon Meta Ads - Relatorio Semanal

on:
  schedule:
    - cron: '5 10 * * 1'  # toda segunda-feira as 07:05 BRT (10:05 UTC)
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar relatorio Meta Ads Luxe Icon
        env:
          LUXE_ICON_META_TOKEN: ${{ secrets.LUXE_ICON_META_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/luxe_icon_meta_report.py

