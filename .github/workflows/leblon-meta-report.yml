name: Leblon Meta Ads - Relatorio Semanal

on:
  workflow_dispatch:       # acionado pelo dispatcher-segunda.yml ou manualmente

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias

      - name: Gerar relatorio Meta Ads Leblon Real Estate
        env:
          META_TOKEN: ${{ secrets.LEBLON_META_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ACCOUNT_ID: "act_1187011709535726"
          CLIENT_NAME: "Leblon Real Estate"
          CURRENCY: "EUR"
          BUDGET_MONTHLY: "1500"
          REPORT_DIR: "reports/data-know/leblon-real-estate"
          USE_MONTH_FOLDER: "false"
        run: python scripts/meta_report_ai.py