name: Clinica Familiar Google Ads Report

on:
  schedule:
    - cron: "0 10 * * 1,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install google-ads python-dotenv

      - name: Gerar relatorio
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: |
          OUTPUT="reports/clinica-familiar/google-clinica-familiar-report-$(date +%Y-%m-%d).md"
          mkdir -p reports/clinica-familiar
          python execution/weekly_report_generator.py \
            --customer-id 3715471664 \
            --mcc-id 2564865113 \
            --client-name "Clinica Assistencia Familiar" \
            --currency BRL \
            --output "$OUTPUT"
          echo "OUTPUT_FILE=$OUTPUT" >> $GITHUB_ENV

      - name: Commit e push
        run: |
          git config user.name "Clinica Familiar Bot"
          git config user.email "bot@plusdigital.com.br"
          git add "${{ env.OUTPUT_FILE }}"
          git commit -m "Relatorio Google Ads Clinica Familiar - $(date +%Y-%m-%d %H:%M)" --allow-empty
          git push

      - name: Acionar sync Notion
        run: |
          curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync-relatorios-notion.yml/dispatches" \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}'
