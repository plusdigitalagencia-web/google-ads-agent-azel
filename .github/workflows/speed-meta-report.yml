name: SpeedMais Meta Ads Report

on:
  schedule:
    - cron: "0 10 15 * *"   # Dia 15 de cada mês às 07:00 BRT
    - cron: "0 10 30 * *"   # Dia 30 de cada mês às 07:00 BRT
  workflow_dispatch:
    inputs:
      since_date:
        description: 'Data inicial do período (YYYY-MM-DD). Padrão: 01 do mês.'
        required: false
        default: ''
      until_date:
        description: 'Data final do período (YYYY-MM-DD). Padrão: data de hoje.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar relatorio
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          SINCE_DATE: ${{ github.event.inputs.since_date }}
          UNTIL_DATE: ${{ github.event.inputs.until_date }}
        run: |
          if [ -n "${{ github.event.inputs.since_date }}" ]; then
            MES_NUM=$(echo "${{ github.event.inputs.since_date }}" | cut -d'-' -f2 | sed 's/^0//')
          else
            MES_NUM=$(date +%-m)
          fi
          case $MES_NUM in
            1) MES="janeiro" ;; 2) MES="fevereiro" ;; 3) MES="marco" ;;
            4) MES="abril" ;; 5) MES="maio" ;; 6) MES="junho" ;;
            7) MES="julho" ;; 8) MES="agosto" ;; 9) MES="setembro" ;;
            10) MES="outubro" ;; 11) MES="novembro" ;; 12) MES="dezembro" ;;
          esac
          mkdir -p "reports/ASSUCAR/speed/${MES}"
          export OUTPUT_FILE="reports/ASSUCAR/speed/${MES}/meta-speed-report-$(date +%Y-%m-%d).md"
          python scripts/speed_meta_report.py
          echo "OUTPUT_FILE=$OUTPUT_FILE" >> $GITHUB_ENV

      - name: Commit e push
        run: |
          git config user.name "SpeedMais Bot"
          git config user.email "bot@plusdigital.com.br"
          git add "${{ env.OUTPUT_FILE }}"
          git commit -m "Relatorio Meta Ads SpeedMais - $(date '+%Y-%m-%d %H:%M')" --allow-empty
          git pull --rebase origin main
          git push

      - name: Acionar sync Notion
        run: |
          curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync-relatorios-notion.yml/dispatches" \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}'
