name: True Change Google Ads Report

on:
  schedule:
    - cron: "0 10 15 * *"   # Dia 15 de cada mês 07:00 BRT — parcial do mes corrente (01 ao 15)
    - cron: "0 10 1 * *"    # Dia 1 de cada mês 07:00 BRT — mes anterior completo (01 ao ultimo dia)
  workflow_dispatch:
    inputs:
      start_date:
        description: "Data inicial (YYYY-MM-DD)"
        required: false
        default: ""
      end_date:
        description: "Data final (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install google-ads python-dotenv

      - name: Gerar relatorio
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: |
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          if [ -n "$START" ] && [ -n "$END" ]; then
            DATE_ARGS="--start-date $START --end-date $END"
            SUFFIX="${START}-to-${END}"
            REF_DATE="$END"
          elif [ "$(date +%-d)" = "1" ]; then
            # Disparo do dia 1 -> mes anterior completo (01 ao ultimo dia, sem cortar dia 31)
            REF_DATE="$(date -d 'yesterday' +%Y-%m-%d)"
            START_DATE="$(date -d "$REF_DATE" +%Y-%m)-01"
            END_DATE="$REF_DATE"
            DATE_ARGS="--start-date $START_DATE --end-date $END_DATE"
            SUFFIX="${START_DATE}-to-${END_DATE}"
          else
            # Disparo do dia 15 -> parcial do mes corrente (01 ao 15)
            REF_DATE="$(date +%Y-%m-%d)"
            START_DATE="$(date +%Y-%m)-01"
            END_DATE="$REF_DATE"
            DATE_ARGS="--start-date $START_DATE --end-date $END_DATE"
            SUFFIX="${START_DATE}-to-${END_DATE}"
          fi

          MONTH_NUM=$(echo "$REF_DATE" | cut -d- -f2)
          case $MONTH_NUM in
            01) MES="janeiro";; 02) MES="fevereiro";; 03) MES="marco";; 04) MES="abril";;
            05) MES="maio";; 06) MES="junho";; 07) MES="julho";; 08) MES="agosto";;
            09) MES="setembro";; 10) MES="outubro";; 11) MES="novembro";; 12) MES="dezembro";;
          esac

          OUTPUT="reports/ASSUCAR/true-change/google/${MES}/google-true-change-report-${SUFFIX}.md"
          mkdir -p "reports/ASSUCAR/true-change/google/${MES}"
          python execution/weekly_report_generator.py \
            --customer-id 9063582846 \
            --mcc-id 2564865113 \
            --client-name "True Change Tecnologia" \
            --currency BRL \
            --output "$OUTPUT" \
            $DATE_ARGS
          echo "OUTPUT_FILE=$OUTPUT" >> $GITHUB_ENV

      - name: Commit e push
        run: |
          git config user.name "True Change Bot"
          git config user.email "bot@plusdigital.com.br"
          git add "${{ env.OUTPUT_FILE }}"
          git commit -m "Relatorio Google Ads True Change - $(date '+%Y-%m-%d')" --allow-empty
          git pull --rebase origin main
          git push

      - name: Acionar sync Notion
        run: |
          curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync-relatorios-notion.yml/dispatches" \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}'
