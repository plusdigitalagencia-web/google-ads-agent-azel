name: Tintado de Luna - Relatorio Semanal Meta Ads

on:
  schedule:
    - cron: '10 10 * * 1'  # toda segunda-feira as 07:10 BRT (10:10 UTC)
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install anthropic

      - name: Gerar relatorio Meta Ads Tintado de Luna
        env:
          META_TOKEN: ${{ secrets.TINTADO_LUNA_META_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCOUNT_ID: "act_9709425065783957"
          CLIENT_NAME: "Tintado de Luna"
          CURRENCY: "EUR"
          BUDGET_MONTHLY: "0"
          REPORT_DIR: "reports/data-know/tintado-de-luna"
          USE_MONTH_FOLDER: "true"
        run: python scripts/meta_report_claude.py
