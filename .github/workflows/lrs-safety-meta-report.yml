name: LRS Safety - Relatorio Semanal Meta Ads

on:
  workflow_dispatch:       # acionado pelo dispatcher-segunda.yml ou manualmente

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar relatorio Meta Ads LRS Safety
        env:
          LRS_SAFETY_META_TOKEN: ${{ secrets.LRS_SAFETY_META_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/lrs_safety_meta_report.py
