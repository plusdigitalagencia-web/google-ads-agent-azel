name: 📊 Sync Relatórios → Notion

on:
  push:
    paths:
      - "reports/**"
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar arquivos alterados
        run: |
          git diff --name-only HEAD~1 HEAD | grep "^reports/" > changed_files.txt || true
          echo "Arquivos detectados:"
          cat changed_files.txt

      - name: Instalar dependências
        run: pip install requests

      - name: Sincronizar com Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 .github/scripts/sync_reports_to_notion.py
