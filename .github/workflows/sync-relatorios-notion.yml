name: Sync Relatorios Notion

on:
  push:
    paths:
      - "reports/**"
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar arquivos alterados
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git diff --name-only HEAD~1 HEAD | grep "^reports/" > changed_files.txt || true
          else
            git diff --name-only HEAD~1 HEAD | grep "^reports/" > changed_files.txt || true
          fi
          echo "Arquivos detectados:"
          cat changed_files.txt

      - name: Instalar dependencias
        run: pip install requests

      - name: Sincronizar com Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/sync_reports_to_notion.py
