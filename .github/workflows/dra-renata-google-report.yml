name: Dra Renata Google Ads Report

on:
  schedule:
    - cron: "0 10 30 * *"     # Dia 30 de cada mês 07:00 BRT — relatório mensal completo
  workflow_dispatch:
    inputs:
      start_date:
        description: "Data inicial (YYYY-MM-DD)"
        required: false
        default: ""
      end_date:
        description: "Data final (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install google-ads python-dotenv

      - name: Gerar relatorio
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: "7118682168"
        run: |
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          if [ -n "$START" ] && [ -n "$END" ]; then
            DATE_ARGS="--start-date $START --end-date $END"
            SUFFIX="${START}-to-${END}"
            REF_DATE="$END"
          else
            # Sem inputs manuais: cron mensal do dia 30 -> relatorio do mes corrente completo (dia 01 ao dia 30/31)
            REF_DATE="$(date +%Y-%m-%d)"
            START="$(date +%Y-%m)-01"
            END="$REF_DATE"
            DATE_ARGS="--start-date $START --end-date $END"
            SUFFIX="$(date +%Y-%m-%d)"
          fi

          MONTH_NUM=$(echo "$REF_DATE" | cut -d- -f2)
          YEAR2=$(echo "$REF_DATE" | cut -d- -f1 | cut -c3-4)
          case $MONTH_NUM in
            01) MES="jan";; 02) MES="fev";; 03) MES="mar";; 04) MES="abr";;
            05) MES="mai";; 06) MES="jun";; 07) MES="jul";; 08) MES="ago";;
            09) MES="set";; 10) MES="out";; 11) MES="nov";; 12) MES="dez";;
          esac
          MES_PASTA="${MES}-${YEAR2}"

          OUTPUT="reports/DUOSFERA/dra-renata/${MES_PASTA}/google-dra-renata-report-${SUFFIX}.md"
          mkdir -p "reports/DUOSFERA/dra-renata/${MES_PASTA}"
          python execution/weekly_report_generator_duosfera.py \
            --customer-id 3511852091 \
            --mcc-id 7118682168 \
            --client-name "Dra Renata Correa" \
            --currency BRL \
            --output "$OUTPUT" \
            $DATE_ARGS
          echo "OUTPUT_FILE=$OUTPUT" >> $GITHUB_ENV

      - name: Commit e push
        run: |
          git config user.name "Dra Renata Bot"
          git config user.email "bot@plusdigital.com.br"
          git add "${{ env.OUTPUT_FILE }}"
          git commit -m "Relatorio Google Ads Dra Renata - $(date +%Y-%m-%d)" --allow-empty
          git pull --rebase origin main
          git push
