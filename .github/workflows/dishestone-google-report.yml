name: Relatório Semanal — Dishestone

on:
  schedule:
    - cron: "0 10 * * 4"  # toda quinta-feira às 7h (Brasília) = 10h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-relatorio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install google-ads python-dotenv

      - name: Gerar relatório
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: "2319759276"
        run: |
          MESES=(jan fev mar abr mai jun jul ago set out nov dez)
          MES_IDX=$(( $(date +%-m) - 1 ))
          MES_PASTA="${MESES[$MES_IDX]}-$(date +%Y)"
          mkdir -p "reports/data-know/dishestone/${MES_PASTA}"
          OUTPUT="reports/data-know/dishestone/${MES_PASTA}/relatorio-$(date +%Y-%m-%d).md"
          python execution/weekly_report_generator.py \
            --customer-id 9936690476 \
            --mcc-id 2319759276 \
            --client-name "Dishestone" \
            --currency EUR \
            --output "$OUTPUT"
          echo "OUTPUT_FILE=$OUTPUT" >> $GITHUB_ENV

      - name: Commitar relatório no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.OUTPUT_FILE }}"
          git diff --cached --quiet || git commit -m "relatorio: dishestone semana $(date +%Y-%V)"
          git push
