name: DEBUG - Inspecionar action types Meta

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rodar debug
        env:
          DUOSFERA_META_TOKEN: ${{ secrets.DUOSFERA_META_TOKEN }}
        run: python scripts/_debug_actions.py
