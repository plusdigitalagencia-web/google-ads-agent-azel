name: Hoteligy Meta Ads - Relatorio Semanal

on:
  workflow_dispatch:       # acionado pelo dispatcher-segunda.yml ou manualmente

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias

      - name: Gerar relatorio Meta Ads Hoteligy
        env:
          META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ACCOUNT_ID: "act_51307638"
          CLIENT_NAME: "Hoteligy"
          CURRENCY: "EUR"
          BUDGET_MONTHLY: "0"
          REPORT_DIR: "reports/data-know/hoteligy"
          USE_MONTH_FOLDER: "true"
        run: python scripts/meta_report_ai.py
