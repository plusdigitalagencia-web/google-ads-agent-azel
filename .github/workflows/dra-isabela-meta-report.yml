name: Dra Isabela Meta Ads - Relatorio Semanal

on:
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar relatorio Meta Ads Dra Isabela
        env:
          DUOSFERA_META_TOKEN: ${{ secrets.DUOSFERA_META_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/dra_isabela_meta_report.py
