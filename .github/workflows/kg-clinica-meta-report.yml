name: KG Clinica Meta Ads - Relatorio Semanal

on:
  workflow_dispatch:       # acionado pelo dispatcher-segunda.yml ou manualmente

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar relatorio Meta Ads KG Clinica y Salud
        env:
          META_TOKEN: ${{ secrets.KG_CLINICA_META_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ACCOUNT_ID: "act_375804741111201"
          CLIENT_NAME: "KG Clinica y Salud"
          CURRENCY: "EUR"
          BUDGET_MONTHLY: "600"
          REPORT_DIR: "reports/data-know/kg-clinica"
          USE_MONTH_FOLDER: "true"
        run: python scripts/meta_report_ai.py