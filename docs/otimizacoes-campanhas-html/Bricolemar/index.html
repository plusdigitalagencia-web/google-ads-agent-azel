<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bricolemar — Otimizações Campanhas HTML</title>
<style>
  :root {
    --ground: #f4f7f5; --panel: #ffffff; --border: #d7e0dc;
    --ink: #142320; --ink-dim: #4b5b56; --ink-faint: #7c8b86;
    --accent: #157567; --accent-soft: #dcefe9;
    --font-sans: -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0c1614; --panel: #121e1b; --border: #24322e;
      --ink: #e7efec; --ink-dim: #a9b8b3; --ink-faint: #7c8b86;
      --accent: #37bfa8; --accent-soft: #17332d;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0c1614; --panel: #121e1b; --border: #24322e;
    --ink: #e7efec; --ink-dim: #a9b8b3; --ink-faint: #7c8b86;
    --accent: #37bfa8; --accent-soft: #17332d;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--font-sans); line-height:1.5; }
  .page { max-width: 720px; margin:0 auto; padding: 56px 24px 80px; display:flex; flex-direction:column; gap:24px; }
  .breadcrumb { font-family: var(--font-mono); font-size:12.5px; color:var(--ink-faint); }
  .breadcrumb a { color:var(--accent); text-decoration:none; }
  h1 { font-size: clamp(22px,4vw,28px); margin:0; text-wrap:balance; }
  .list { display:flex; flex-direction:column; gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  a.row { display:flex; flex-direction:column; gap:3px; padding:16px 18px; background:var(--panel); text-decoration:none; color:var(--ink); }
  a.row:hover { background: var(--accent-soft); }
  a.row .slug { font-family:var(--font-mono); font-weight:600; font-size:14.5px; }
  a.row .meta { font-size:12.5px; color:var(--ink-faint); }
  footer { border-top:1px solid var(--border); padding-top:16px; font-size:12.5px; color:var(--ink-faint); }
</style>
</head>
<body>
  <div class="page">
    <span class="breadcrumb"><a href="../">Otimizações Campanhas HTML</a> / Bricolemar</span>
    <h1>Bricolemar</h1>
    <div class="list">
      <a class="row" href="Julho/">
        <span class="slug">Julho/2026</span>
        <span class="meta">1 campanha — Search Paelleros</span>
      </a>
    </div>
    <footer>Conta Google Ads 786-137-8385 · MCC Data Know 231-975-9276</footer>
  </div>
</body>
</html>
