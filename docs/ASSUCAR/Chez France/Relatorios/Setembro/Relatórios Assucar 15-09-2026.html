<title>Quinzenal Assucar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#FBF8F4; --surface:#FFFFFF; --surface-2:#F5EFE9;
  --ink:#231A1D; --ink-2:#5C4E52; --ink-3:#8A7A7E;
  --rule:#E6DBD3; --rule-strong:#D3C3B9;
  --accent:#14603D; --accent-soft:#E3EFE8; --gold:#A8792E;
  --bom:#2F8F5B; --bom-bg:#E6F2EA;
  --alerta:#A8641A; --alerta-bg:#F9EEDE;
  --ruim:#C10D1E; --ruim-bg:#FBE2E4;
  --novo:#3F6493; --novo-bg:#E5ECF6;
  --meta-c:#3A5CA8; --google-c:#B06A1E;
  --azul:#1D5FA8; --azul-bg:#EBF2FA; --azul-rule:#C8DCF0;
  --laranja:#9A3F06; --laranja-bg:#F8D3AC; --laranja-rule:#E3A96F;
  --shadow:0 1px 2px rgba(35,26,29,.04), 0 10px 26px -18px rgba(35,26,29,.30);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0F1310; --surface:#171C18; --surface-2:#1E241F;
  --ink:#E9F0EA; --ink-2:#A9B8AC; --ink-3:#7A8A7D;
  --rule:#272E28; --rule-strong:#3A443B;
  --accent:#6FD19B; --accent-soft:#13301F; --gold:#D9A94F;
  --bom:#5CC79A; --bom-bg:#153024;
  --alerta:#E2A752; --alerta-bg:#33260F;
  --ruim:#FF4D58; --ruim-bg:#3D1216;
  --novo:#8FAEDC; --novo-bg:#1B2436;
  --meta-c:#8FAEDC; --google-c:#E0A860;
  --azul:#7FB4EA; --azul-bg:#131D2B; --azul-rule:#24354A;
  --laranja:#FFB874; --laranja-bg:#54300C; --laranja-rule:#7A4A18;
  --shadow:0 1px 2px rgba(0,0,0,.30), 0 10px 26px -18px rgba(0,0,0,.70);
}}
:root[data-theme="dark"]{
  --ground:#0F1310; --surface:#171C18; --surface-2:#1E241F;
  --ink:#E9F0EA; --ink-2:#A9B8AC; --ink-3:#7A8A7D;
  --rule:#272E28; --rule-strong:#3A443B;
  --accent:#6FD19B; --accent-soft:#13301F; --gold:#D9A94F;
  --bom:#5CC79A; --bom-bg:#153024;
  --alerta:#E2A752; --alerta-bg:#33260F;
  --ruim:#FF4D58; --ruim-bg:#3D1216;
  --novo:#8FAEDC; --novo-bg:#1B2436;
  --meta-c:#8FAEDC; --google-c:#E0A860;
  --azul:#7FB4EA; --azul-bg:#131D2B; --azul-rule:#24354A;
  --laranja:#FFB874; --laranja-bg:#54300C; --laranja-rule:#7A4A18;
  --shadow:0 1px 2px rgba(0,0,0,.30), 0 10px 26px -18px rgba(0,0,0,.70);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding-inline:20px; padding-block:0 64px}
h1,h2,h3{font-family:"Fraunces","Iowan Old Style",Georgia,serif; text-wrap:balance; margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- topo ---------- */
header.top{
  background:var(--surface); border-bottom:1px solid var(--rule);
}
.top-in{max-width:1120px; margin:0 auto; padding:26px 20px 20px; display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; justify-content:space-between}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600}
h1{font-size:clamp(26px,4.4vw,38px); font-weight:600; letter-spacing:-.015em; margin-top:6px}
.periodo{color:var(--ink-2); font-size:14px; margin-top:8px}
.periodo b{color:var(--ink); font-weight:600}
.fontes{display:flex; gap:8px; flex-wrap:wrap}
.fonte{
  display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:500;
  border:1px solid var(--rule-strong); border-radius:999px; padding:6px 12px; color:var(--ink-2);
  background:var(--surface);
}
.dot{width:7px; height:7px; border-radius:50%; background:var(--bom)}

/* ---------- barra de clientes ---------- */
.clientes-barra{border-top:1px solid var(--rule); background:var(--surface-2)}
.clientes-in{
  max-width:1120px; margin:0 auto; padding:10px 20px; display:flex; gap:8px;
  overflow-x:auto; align-items:stretch;
}
.cliente{
  appearance:none; font-family:inherit; cursor:pointer; white-space:nowrap; text-align:left;
  background:var(--surface); border:1px solid var(--rule-strong); border-radius:9px;
  padding:8px 14px; color:var(--ink-2); font-size:13.5px; font-weight:600;
  display:flex; flex-direction:column; gap:2px; transition:border-color .12s, color .12s;
}
.cliente .canais{font-size:10.5px; font-weight:500; color:var(--ink-3); letter-spacing:.02em}
.cliente:hover{color:var(--ink); border-color:var(--ink-3)}
.cliente[aria-selected="true"]{
  background:var(--accent); border-color:var(--accent); color:#fff;
}
.cliente[aria-selected="true"] .canais{color:rgba(255,255,255,.75)}
.cliente:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- abas ---------- */
nav.abas{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--ground) 92%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--rule);
}
.abas-in{max-width:1120px; margin:0 auto; padding-inline:20px; display:flex; gap:2px; overflow-x:auto}
.aba{
  appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  font-family:inherit; font-size:14px; font-weight:500; color:var(--ink-3);
  padding:14px 14px 11px; cursor:pointer; white-space:nowrap;
}
.aba:hover{color:var(--ink)}
.aba[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}
.aba:focus-visible{outline:2px solid var(--accent); outline-offset:-4px; border-radius:4px}

/* ---------- blocos ---------- */
section.painel{padding-top:30px}
.titulo-sec{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:34px 0 14px}
.titulo-sec:first-child{margin-top:0}
.titulo-sec h2{font-size:21px; font-weight:600; letter-spacing:-.01em}
.titulo-sec p{margin:0; color:var(--ink-3); font-size:13px}

/* ---------- KPIs ---------- */
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:10px; overflow:hidden}
.kpis[data-n="6"]{grid-template-columns:repeat(3,1fr)}
@media (max-width:980px){ .kpis,.kpis[data-n="6"]{grid-template-columns:repeat(2,1fr)} }
@media (max-width:520px){ .kpis,.kpis[data-n="6"]{grid-template-columns:1fr} }
.kpi{background:var(--surface); padding:14px 16px 15px}
.kpi .rot{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.kpi .val{font-family:"Fraunces",Georgia,serif; font-size:23px; font-weight:600; letter-spacing:-.01em; margin-top:5px; font-variant-numeric:tabular-nums}
.cap{font-size:11.5px; color:var(--ink-3); margin:8px 0 0; max-width:74ch}
.kpi.destaque{background:var(--surface-2); box-shadow:inset 3px 0 0 var(--accent)}
.kpi .rot em{font-style:normal; font-weight:500; letter-spacing:0; text-transform:none; opacity:.75}
.kpi .reparticao{
  display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:9px; padding-top:8px;
  border-top:1px solid var(--rule); font-size:11.5px; color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.kpi .split{display:flex; flex-direction:column; gap:7px; margin-top:8px}
.kpi .split .linha{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.kpi .split .canal{
  font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  border-radius:4px; padding:2px 6px; white-space:nowrap;
}
.kpi .split .canal.meta{background:var(--novo-bg); color:var(--meta-c)}
.kpi .split .canal.google{background:var(--alerta-bg); color:var(--google-c)}
.kpi .split .v{
  font-family:"Fraunces",Georgia,serif; font-size:19px; font-weight:600;
  letter-spacing:-.01em; font-variant-numeric:tabular-nums; margin-right:auto;
}
.kpi .split .delta{margin-top:0}
.kpi .obs{font-size:10.5px; color:var(--ink-3); margin-top:9px; line-height:1.4}
.delta{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; margin-top:5px; font-variant-numeric:tabular-nums; white-space:nowrap}
.delta.up{color:var(--bom)} .delta.down{color:var(--ruim)} .delta.flat{color:var(--ink-3)}

/* ---------- cards de campanha ---------- */
.cards{display:flex; flex-direction:column; gap:14px}
.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:12px;
  box-shadow:var(--shadow); overflow:hidden; border-left:4px solid var(--rule-strong);
}
.card.melhorou{border-left-color:var(--bom)}
.card.atencao{border-left-color:var(--ruim)}
.card.estavel{border-left-color:var(--alerta)}
.card.novo{border-left-color:var(--novo)}
.card-top{display:flex; gap:14px; align-items:flex-start; justify-content:space-between; padding:16px 18px 12px; flex-wrap:wrap}
.card-nome{font-family:"Fraunces",Georgia,serif; font-size:17px; font-weight:600; letter-spacing:-.01em; line-height:1.3}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px}
.chip{font-size:11px; font-weight:500; color:var(--ink-2); background:var(--surface-2); border-radius:5px; padding:3px 8px}
.selo{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
  border-radius:999px; padding:5px 11px; white-space:nowrap;
}
.selo.melhorou{background:var(--bom-bg); color:var(--bom)}
.selo.atencao{background:var(--ruim-bg); color:var(--ruim)}
.selo.estavel{background:var(--alerta-bg); color:var(--alerta)}
.selo.novo{background:var(--novo-bg); color:var(--novo)}

.metricas{display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:1px; background:var(--rule); border-top:1px solid var(--rule)}
.m{background:var(--surface); padding:11px 14px 12px}
.m .rot{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.m .val{font-size:16px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums}
.m.chave{background:var(--surface-2)}

/* comparativo com seta dentro dos cards e KPIs */
.comp{
  display:flex; align-items:baseline; gap:4px; margin-top:6px; font-size:11px;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.comp .antes{color:var(--ink-3); font-weight:500}
.comp .seta{font-size:13px; line-height:1; font-weight:700}
.comp .pcv{font-weight:700}
.comp.up .seta,.comp.up .pcv{color:var(--bom)}
.comp.down .seta,.comp.down .pcv{color:var(--ruim)}
.comp.flat .seta,.comp.flat .pcv{color:var(--ink-3)}
.comp.vazio{color:var(--ink-3); font-style:italic}

/* tabelas dentro do card de campanha — blocos que abrem e fecham */
.card-tabela{border-top:1px solid var(--rule); padding:0}
.ct-titulo{
  font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
  color:var(--ink-2); display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  padding:13px 18px; cursor:pointer; list-style:none; user-select:none;
}
.ct-titulo::-webkit-details-marker{display:none}
.ct-titulo:hover{background:var(--surface-2)}
.ct-titulo:focus-visible{outline:2px solid var(--accent); outline-offset:-3px}
.ct-corpo{padding:0 18px 16px}
.chev{
  width:8px; height:8px; flex:none; display:inline-block; opacity:.55;
  border-right:2px solid currentColor; border-bottom:2px solid currentColor;
  transform:rotate(-45deg) translate(-1px,-1px); transition:transform .15s ease;
}
details[open] > .ct-titulo .chev{transform:rotate(45deg) translate(-1px,-1px)}
@media (prefers-reduced-motion:reduce){ .chev{transition:none} }
.ct-titulo em{font-style:normal; font-size:10.5px; letter-spacing:.02em; text-transform:none; color:var(--ink-3); font-weight:500}
.tabela-box.compacta table{min-width:560px; font-size:12.5px}
.tabela-box.compacta th,.tabela-box.compacta td{padding:7px 10px}
.tabela-box.compacta td.txt{white-space:normal; min-width:200px; line-height:1.45}
th.esq,td.esq,.tabela-box.compacta td.txt,.tabela-box.compacta th.txt{text-align:left}
.tabela-box.compacta td.forte{font-weight:600}
.ink3{color:var(--ink-3)}
.ok{color:var(--bom); font-weight:500}
.nok{color:var(--ruim); font-weight:500}
.ct-diagnostico{
  margin:10px 0 0; font-size:13px; line-height:1.6; color:var(--ink-2);
  background:var(--surface-2); border-radius:8px; padding:11px 13px;
}
.ct-diagnostico b{color:var(--ink); font-weight:600}
.ct-contexto{margin-top:12px}
.ct-subtitulo{font-size:11.5px; color:var(--ink-3); margin-bottom:7px}
tr.pendente td{white-space:normal; color:var(--ink-3); font-size:12.5px}

/* conjuntos */
.conjuntos{border-top:1px solid var(--rule); background:var(--surface-2)}
.conj-rot{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:11px 18px 6px}
.conj{display:grid; grid-template-columns:minmax(140px,1.8fr) repeat(var(--cols,6),minmax(60px,1fr));
  gap:10px; padding:8px 18px; align-items:center; font-size:13px; border-top:1px solid var(--rule)}
.conj.cabecalho{
  font-size:10px; letter-spacing:.05em; text-transform:uppercase; font-weight:700;
  color:var(--ink-3); padding-top:6px; padding-bottom:6px;
}
.conj.cabecalho .nome{font-weight:700}
.conj.cabecalho .num{color:var(--ink-3)}
.conj:last-child{padding-bottom:13px}
.conj .nome{font-weight:500; overflow-wrap:anywhere}
.conj span.num{text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-2)}
.conj span.num b{color:var(--ink); font-weight:600}

/* ---------- tabelas ---------- */
.tabela-box{border:1px solid var(--rule); border-radius:10px; overflow-x:auto; background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:640px; font-size:13.5px}
th,td{padding:10px 11px; text-align:right; border-bottom:1px solid var(--rule); white-space:nowrap}
th{font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600; background:var(--surface-2); position:sticky; top:0}
td:first-child,th:first-child{text-align:left; white-space:normal; min-width:180px}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{font-variant-numeric:tabular-nums}
th.ord{cursor:pointer; user-select:none; white-space:nowrap}
th.ord:hover{color:var(--ink)}
th.ord:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
th.ord .seta{
  display:inline-block; width:0; height:0; margin-left:6px; vertical-align:middle;
  border-left:4px solid transparent; border-right:4px solid transparent; opacity:0;
}
th.ord:hover .seta{opacity:.35}
th.ord.ativa{color:var(--accent)}
th.ord.ativa .seta{opacity:1}
th.ord.desc .seta{border-top:5px solid currentColor}
th.ord.asc .seta{border-bottom:5px solid currentColor}

.tag{display:inline-block; font-size:10.5px; font-weight:600; border-radius:4px; padding:2px 7px; margin-left:8px}
.tag.bom{background:var(--bom-bg); color:var(--bom)}
.tag.ruim{background:var(--ruim-bg); color:var(--ruim)}
.tag.alerta{background:var(--alerta-bg); color:var(--alerta)}
.sub.eficiente{color:var(--bom); font-weight:600}
.sub.medio{color:var(--alerta); font-weight:600}
.sub.caro{color:var(--ruim); font-weight:600}
.sub{display:block; font-size:11.5px; color:var(--ink-3); font-weight:400; margin-top:2px}

/* pílula de ROAS comparado com uma base */
.pilula{
  display:inline-flex; align-items:baseline; gap:6px; border-radius:6px; padding:4px 9px;
  font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;
}
.pilula em{font-style:normal; font-size:11px; font-weight:600; opacity:.85}
.pilula.up{background:var(--bom-bg); color:var(--bom)}
.pilula.down{background:var(--alerta-bg); color:var(--alerta)}

/* tabela das três quinzenas */
table.tempo td:first-child,table.tempo th:first-child{min-width:130px; color:var(--ink-2); font-size:13px}
table.tempo th{vertical-align:bottom; text-transform:none; letter-spacing:0; font-size:12px; font-weight:600; color:var(--ink-2)}
table.tempo th .sub{text-transform:none; letter-spacing:0}
table.tempo .agora{background:var(--surface-2)}
table.tempo th.agora{color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent)}
table.tempo tr.roas td{border-top:1px solid var(--rule-strong); font-size:15px}

/* bloco de públicos em laranja */
.card-tabela.laranja{background:var(--laranja-bg); border-top:1px solid var(--laranja-rule)}
.card-tabela.laranja .sg-rot{color:var(--laranja)}
.card-tabela.laranja .sg-rot span{background:color-mix(in srgb, var(--laranja-bg) 45%, var(--surface)); color:var(--laranja)}
.card-tabela.laranja .pill{background:color-mix(in srgb, var(--laranja-bg) 55%, var(--surface)); border-color:var(--laranja-rule)}
.card-tabela.laranja .cap{color:var(--laranja)}
.card.publico{border-left-color:var(--laranja)}

/* blocos de PMax em azul, para separar do verde do relatório */
.card-tabela.azul{background:var(--azul-bg); border-top:1px solid var(--azul-rule)}
.card-tabela.azul .ct-titulo{color:var(--azul)}
.card-tabela.azul .ct-titulo em{color:var(--azul); opacity:.7}
.card-tabela.azul .tabela-box{border-color:var(--azul-rule)}
.card-tabela.azul th{background:color-mix(in srgb, var(--azul-bg) 55%, var(--surface)); color:var(--azul)}
.card-tabela.azul td{border-bottom-color:var(--azul-rule)}
.card-tabela.azul .ct-diagnostico{background:color-mix(in srgb, var(--azul-bg) 60%, var(--surface))}

/* públicos e segmentação */
.pub-grupo{margin-bottom:14px}
.pub-grupo:last-child{margin-bottom:0}
.pill.publico{background:var(--novo-bg); border-color:transparent; color:var(--meta-c); font-weight:500}
.pill.excluido{background:var(--ruim-bg); border-color:transparent; color:var(--ruim); font-weight:500}
.ct-vazio{margin:0; font-size:13px; color:var(--ink-3)}

/* sinais da PMax */
.sinais-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px}
.sg-rot{
  font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:700;
  color:var(--ink-3); margin-bottom:8px; display:flex; gap:7px; align-items:center;
}
.sg-rot span{
  background:var(--surface-2); border-radius:999px; padding:1px 8px; font-size:11px;
  letter-spacing:0; color:var(--ink-2);
}
.sg-lista{display:flex; flex-wrap:wrap; gap:6px}
.pill{
  font-size:12px; background:var(--surface-2); border:1px solid var(--rule);
  border-radius:999px; padding:4px 10px; color:var(--ink-2);
}
.pill.publico{background:var(--novo-bg); border-color:transparent; color:var(--meta-c); font-weight:500}

/* destaques da quinzena */
.destaques{display:grid; grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); gap:12px}
.destaque{
  background:var(--surface); border:1px solid var(--rule); border-top:3px solid var(--rule-strong);
  border-radius:10px; padding:14px 16px 15px;
}
.destaque.bom{border-top-color:var(--bom)}
.destaque.ruim{border-top-color:var(--ruim)}
.destaque.alerta{border-top-color:var(--alerta)}
.destaque.novo{border-top-color:var(--novo)}
.destaque h3{
  font-family:"Archivo",sans-serif; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  font-weight:700; margin-bottom:7px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;
}
.destaque h3 .canal{
  font-size:10px; letter-spacing:.04em; font-weight:600; color:var(--ink-3);
  background:var(--surface-2); border-radius:4px; padding:2px 6px;
}
.destaque.bom h3{color:var(--bom)} .destaque.ruim h3{color:var(--ruim)}
.destaque.alerta h3{color:var(--alerta)} .destaque.novo h3{color:var(--novo)}

/* placar de vereditos */
.placar{display:flex; gap:12px; flex-wrap:wrap; margin-top:12px}
.placar-item{
  display:flex; align-items:center; gap:12px; background:var(--surface-2);

}

/* ---------- legenda / rodapé ---------- */
.legenda{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink-3); margin-top:12px}
.legenda span{display:inline-flex; align-items:center; gap:6px}
.legenda i{width:9px; height:9px; border-radius:2px; display:inline-block; font-style:normal}
.nota{background:var(--surface-2); border:1px solid var(--rule); border-radius:10px; padding:14px 16px; font-size:13px; color:var(--ink-2); line-height:1.6}

footer{margin-top:44px; padding-top:18px; border-top:1px solid var(--rule); font-size:12px; color:var(--ink-3); line-height:1.7}

@media (max-width:640px){
  .conj{grid-template-columns:1fr 1fr 1fr; gap:6px 10px}
  .conj .nome{grid-column:1/-1}
  .card-top{gap:10px}
}

/* ---------- formatação pt-BR ---------- */
const brl = v => v == null ? "—" : "R$ " + v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const int = v => v == null ? "—" : Math.round(v).toLocaleString("pt-BR");
const dec = (v,n=2) => v == null ? "—" : v.toLocaleString("pt-BR",{minimumFractionDigits:n,maximumFractionDigits:n});
const pc  = v => v == null ? "—" : dec(v,2) + "%";
const x   = v => v == null ? "—" : dec(v,2) + "x";

/* subir é ruim / subir é neutro — o resto, subir é bom */
const RUIM_SUBIR = new Set(["cpa","cpc","frequencia"]);
const NEUTRO = new Set(["gasto","impressoes","cliques"]);
function delta(campo, valor){
  if (valor == null) return "";
  const cls = NEUTRO.has(campo) || Math.abs(valor) < 5 ? "flat"
            : RUIM_SUBIR.has(campo) ? (valor > 0 ? "down" : "up")
            : (valor > 0 ? "up" : "down");
  const seta = valor > 0 ? "▲" : valor < 0 ? "▼" : "▪";
  return `<span class="delta ${cls}">${seta} ${dec(Math.abs(valor),1)}%</span>`;
}

/* rótulos em português para os códigos crus da API */
const ROTULO = {
  PERFORMANCE_MAX:"Performance Max", SEARCH:"Rede de Pesquisa", SHOPPING:"Shopping",
  DISPLAY:"Display", VIDEO:"Vídeo", DEMAND_GEN:"Demand Gen",
  MAXIMIZE_CONVERSIONS:"Maximizar conversões", MAXIMIZE_CONVERSION_VALUE:"Maximizar valor",
  TARGET_CPA:"CPA desejado", TARGET_ROAS:"ROAS desejado", TARGET_SPEND:"Maximizar cliques",
  OUTCOME_SALES:"Vendas", OUTCOME_LEADS:"Geração de leads", OUTCOME_TRAFFIC:"Tráfego",
  OUTCOME_ENGAGEMENT:"Engajamento", OUTCOME_AWARENESS:"Reconhecimento"
};
const rot = v => v ? (ROTULO[v] || v) : null;

/* o relatório se adapta ao que a conta mede: venda com valor (ROAS) ou lead/contato */
const VENDAS = () => D.modo === "vendas";
const RES   = () => D.resultado;        // "Compras" | "Leads" | "Contatos"
const RES1  = () => D.resultado_sing;   // "compra"  | "lead"  | "contato"
const CUSTO_RES = () => "Custo por " + RES1();

const SELOS = {
  melhorou:["🟢","Melhorou"], estavel:["🟡","Estável"],
  atencao:["🔴","Atenção"],  novo:["🆕","1ª leitura"]
};

/* ---------- componentes ---------- */
/* comparativo explícito: valor de agosto, seta e variação */
function comparativo(campo, atual, base, fmt){
  if (atual == null || base == null || !base) return `<div class="comp vazio">sem base em agosto</div>`;
  const v = (atual - base) / base * 100;
  const cls = NEUTRO.has(campo) || Math.abs(v) < 5 ? "flat"
            : RUIM_SUBIR.has(campo) ? (v > 0 ? "down" : "up")
            : (v > 0 ? "up" : "down");
  const seta = v > 0 ? "↗" : v < 0 ? "↘" : "→";
  return `<div class="comp ${cls}">
    <span class="antes">ago. ${fmt(base)}</span>
    <span class="seta" aria-hidden="true">${seta}</span>
    <span class="pcv">${dec(Math.abs(v),1)}%</span>
  </div>`;
}

function kpiGrid(k, campos, base){
  return `<div class="kpis">` + campos.map(([campo,rotulo,fmt,destaque])=>{
    const v = k[campo];
    return `<div class="kpi${destaque?" destaque":""}">
      <div class="rot">${rotulo}</div>
      <div class="val">${fmt(v)}</div>
      ${base ? comparativo(campo, v, base[campo], fmt) : delta(campo, k.deltas ? k.deltas[campo] : null)}
    </div>`;
  }).join("") + `</div>
  <p class="cap">▲▼ variação contra a 1ª quinzena de agosto (${D.comparacao.inicio} a ${D.comparacao.fim})</p>`;
}

function cardCampanha(c, opts={}){
  const [emoji,txt] = SELOS[c.selo] || SELOS.estavel;
  const chips = (opts.chips||[]).filter(Boolean).map(t=>`<span class="chip">${t}</span>`).join("");
  const mets = opts.metricas.map(([campo,rotulo,fmt,chave])=>`
    <div class="m${chave?" chave":""}">
      <div class="rot">${rotulo}</div>
      <div class="val">${fmt(c[campo])}</div>
      ${c.anterior ? comparativo(campo, c[campo], c.anterior[campo], fmt)
                   : `<div class="comp vazio">não rodou em agosto</div>`}
    </div>`).join("");
  const conjuntos = (c.conjuntos || []).slice().sort((a,b)=> b.compras - a.compras || b.gasto - a.gasto);
  const conj = conjuntos.length > 1 ? `
    <div class="conjuntos">
      <div class="conj-rot">Conjuntos de anúncios</div>
      ${tabelaOrdenavel(
        ["Conjunto","Investimento","Cliques","CTR","Frequência",RES(),CUSTO_RES(),
         ...(VENDAS() ? ["ROAS"] : [])],
        conjuntos.map(s=>({
          cels:[`<b>${s.nome}</b>`, brl(s.gasto), int(s.cliques), pc(s.ctr), dec(s.frequencia,2),
                `<b>${dec(s.compras, s.compras % 1 ? 1 : 0)}</b>`,
                s.cpa != null ? brl(s.cpa) : "—",
                ...(VENDAS() ? [`<b>${x(s.roas)}</b>`] : [])],
          vals:[s.nome, s.gasto, s.cliques, s.ctr, s.frequencia, s.compras,
                s.cpa == null ? Infinity : s.cpa, s.roas]
        })), 5, "compacta")}
    </div>` : "";

  return `<article class="card ${c.selo}">
    <div class="card-top">
      <div>
        <div class="card-nome">${c.nome}</div>
        <div class="chips">${chips}</div>
      </div>
      <span class="selo ${c.selo}">${emoji} ${txt}</span>
    </div>
    <div class="metricas">${mets}</div>
    ${conj}
    ${opts.tabelas === false ? "" :
       tabelaAnalise(c, opts.unidade || "compra") + (opts.extra || "") + tabelaOtimizacoes(c)}
  </article>`;
}

/* tabela 1 do card: o que os dados de API dizem */
function tabelaAnalise(c, unidade){
  const linhas = [
    ["Investimento", "gasto", brl],
    [RES(), "compras", v=>dec(v, v%1?1:0)],
    VENDAS() ? ["Receita", "receita", brl] : null,
    [CUSTO_RES(), "cpa", brl],
    VENDAS() ? ["ROAS", "roas", x] : null,
    ["Cliques", "cliques", int],
    ["CTR", "ctr", pc],
    c.frequencia != null ? ["Frequência", "frequencia", v=>dec(v,2)] : null,
    ["Impressões", "impressoes", int]
  ].filter(Boolean);

  const leitura = (campo, atual, base) => {
    if (base == null || !base) return "<span class='ink3'>sem base</span>";
    const v = (atual - base) / base * 100;
    if (Math.abs(v) < 5) return "<span class='ink3'>estável</span>";
    const sobe = v > 0;
    const bom = NEUTRO.has(campo) ? null : (RUIM_SUBIR.has(campo) ? !sobe : sobe);
    /* descrição literal da variação — sem atribuir causa */
    const palavra = {
      gasto: sobe ? "mais verba" : "menos verba",
      impressoes: sobe ? "mais exibições" : "menos exibições",
      cliques: sobe ? "mais cliques" : "menos cliques",
      compras: sobe ? "mais volume" : "menos volume",
      receita: sobe ? "mais receita" : "menos receita",
      cpa: sobe ? "mais caro por resultado" : "mais barato por resultado",
      roas: sobe ? "mais receita por real" : "menos receita por real",
      ctr: sobe ? "mais cliques por exibição" : "menos cliques por exibição",
      frequencia: sobe ? "mais exibições por pessoa" : "menos exibições por pessoa"
    }[campo] || (sobe ? "subiu" : "caiu");
    const cls = bom === null ? "ink3" : bom ? "ok" : "nok";
    return `<span class="${cls}">${palavra}</span>`;
  };

  return `<details class="card-tabela" open>
    <summary class="ct-titulo"><i class="chev"></i>Análise dos dados <em>puxado da API no período</em></summary>
    <div class="ct-corpo">
    <div class="tabela-box compacta"><table>
      <thead><tr>
        <th class="esq">Indicador</th><th class="num">1ª quinz. setembro</th><th class="num">1ª quinz. agosto</th>
        <th class="num">Variação</th><th class="esq">Leitura</th>
      </tr></thead>
      <tbody>
        ${linhas.map(([rotulo,campo,fmt])=>{
          const a = c[campo], b = c.anterior ? c.anterior[campo] : null;
          const v = (b != null && b) ? (a - b) / b * 100 : null;
          const cls = v == null ? "flat"
                    : NEUTRO.has(campo) || Math.abs(v) < 5 ? "flat"
                    : RUIM_SUBIR.has(campo) ? (v > 0 ? "down" : "up") : (v > 0 ? "up" : "down");
          return `<tr>
            <td class="esq">${rotulo}</td>
            <td class="num forte">${fmt(a)}</td>
            <td class="num ink3">${b != null ? fmt(b) : "—"}</td>
            <td class="num"><span class="delta ${cls}">${v == null ? "—"
              : `${v > 0 ? "↗" : v < 0 ? "↘" : "→"} ${dec(Math.abs(v),1)}%`}</span></td>
            <td class="esq">${leitura(campo, a, b)}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table></div>
  </div></details>`;
}

/* tabela 2 do card: o log de otimizações da planilha */
function tabelaOtimizacoes(c){
  const dentro = c.otimizacoes || [];
  const antes = c.otimizacoes_anteriores || [];
  const linha = o => `<tr>
    <td class="num">${o.data}${o.origem === "gestor" ? `<span class="sub">fora da planilha</span>` : ""}</td>
    <td class="esq">${o.tipo || "—"}<span class="sub">${o.prioridade || ""}</span></td>
    <td class="txt">${o.feito}</td>
    <td class="txt ink3">${o.porque}</td>
    <td class="txt ink3">${o.esperado || "—"}</td>
  </tr>`;

  const corpo = `<div class="tabela-box compacta"><table>
      <thead><tr><th>Data</th><th class="esq">Tipo</th><th class="txt">O que foi feito</th><th class="txt">Por que foi necessário</th><th class="txt">Resultado esperado</th></tr></thead>
      <tbody>${dentro.length ? dentro.map(linha).join("")
        : `<tr class="pendente"><td colspan="5">
             <span class="tag alerta">pendente</span> A preencher pelo gestor — nada registrado nesta campanha
             entre ${D.periodo.inicio} e ${D.periodo.fim}.</td></tr>`}</tbody>
    </table></div>`;

  const contexto = antes.length ? `
    <div class="ct-contexto">
      <div class="ct-subtitulo">Última ação registrada antes do período — é ela que explica o resultado desta quinzena</div>
      <div class="tabela-box compacta"><table>
        <thead><tr><th>Data</th><th class="esq">Tipo</th><th class="txt">O que foi feito</th><th class="txt">Por que foi necessário</th><th class="txt">Resultado esperado</th></tr></thead>
        <tbody>${antes.map(linha).join("")}</tbody>
      </table></div>
    </div>` : "";

  return `<details class="card-tabela">
    <summary class="ct-titulo"><i class="chev"></i>Otimizações realizadas no período <em>${
      dentro.some(o=>o.origem === "gestor")
        ? "registrado nesta leitura — ainda não está na planilha"
        : "log da planilha"}</em></summary>
    <div class="ct-corpo">
    ${corpo}
    ${contexto}
  </div></details>`;
}

/* tabela com colunas clicáveis: clique no cabeçalho ordena, a seta mostra a coluna ativa */
function tabelaOrdenavel(colunas, linhas, ativa, extraClasse){
  return `<div class="tabela-box ${extraClasse || ""}"><table>
    <thead><tr>${colunas.map((rotulo,i)=>
      `<th class="num ord${i === ativa ? " ativa desc" : ""}" data-i="${i}" tabindex="0" role="button"
           title="Ordenar por ${rotulo}">${rotulo}<i class="seta" aria-hidden="true"></i></th>`).join("")}</tr></thead>
    <tbody>${linhas.map(l=>`<tr>${l.cels.map((cel,i)=>
      `<td class="num" data-v="${l.vals[i]}">${cel}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

function ordenarPor(th){
  const tab = th.closest("table");
  const i = +th.dataset.i;
  const desc = !th.classList.contains("desc");
  [...tab.tHead.rows[0].cells].forEach(c=>c.classList.remove("ativa","desc","asc"));
  th.classList.add("ativa", desc ? "desc" : "asc");
  const corpo = tab.tBodies[0];
  [...corpo.rows].sort((a,b)=>{
    const va = a.cells[i].dataset.v, vb = b.cells[i].dataset.v;
    const na = parseFloat(va), nb = parseFloat(vb);
    const cmp = (isNaN(na) || isNaN(nb)) ? String(va).localeCompare(String(vb),"pt-BR") : na - nb;
    return desc ? -cmp : cmp;
  }).forEach(r=>corpo.appendChild(r));
}

document.addEventListener("click", e=>{
  const th = e.target.closest && e.target.closest("th.ord");
  if (th) ordenarPor(th);
});
document.addEventListener("keydown", e=>{

    e.preventDefault(); ordenarPor(e.target);
  }
});

/* KPIs do consolidado: investimento e receita somados, o resto quebrado por canal */
function kpiConsolidado(){
  const d = D, c = d.consolidado;
  const m = (d.meta || {}).kpis, g = (d.google || {}).kpis;

  const dois = D.canais.length > 1;
  const nKpis = () => VENDAS() ? 8 : 6;
  const somado = (campo, rotulo, fmt, destaque) => `
    <div class="kpi${destaque?" destaque":""}">
      <div class="rot">${rotulo}${dois ? ` <em>soma dos canais</em>` : ""}</div>
      <div class="val">${fmt(c[campo])}</div>
      ${delta(campo, c.deltas ? c.deltas[campo] : null)}
      ${dois ? `<div class="reparticao">
        <span>Meta ${fmt(m[campo])}</span><span>Google ${fmt(g[campo])}</span>
      </div>` : ""}
    </div>`;

  const porCanal = (campo, rotulo, fmt, rotuloGoogle) => `
    <div class="kpi">
      <div class="rot">${rotulo}</div>
      <div class="split">
        ${[["Meta",m],["Google",g]].filter(([,k])=>k).map(([canal,k])=>`
          <div class="linha">
            ${dois ? `<span class="canal ${canal.toLowerCase()}">${canal}</span>` : ""}
            <span class="v">${fmt(k[campo])}</span>
            ${delta(campo, k.deltas[campo])}
          </div>`).join("")}
      </div>
      ${rotuloGoogle ? `<div class="obs">${rotuloGoogle}</div>` : ""}
    </div>`;

  return `<div class="kpis" data-n="${nKpis()}">
    ${somado("gasto","Investimento",brl,true)}
    ${VENDAS() ? somado("receita","Receita",brl) : ""}
    ${VENDAS() ? porCanal("roas","ROAS",x) : ""}
    ${porCanal("compras",RES(),v=>dec(v,v%1?1:0),
      D.canais.includes("google") ? "Google conta conversões, que podem incluir frações de atribuição" : "")}
    ${porCanal("cpa",CUSTO_RES(),brl)}
    ${porCanal("cliques","Cliques",int)}
    ${porCanal("ctr","CTR",pc)}
    ${porCanal("impressoes","Impressões",int)}
  </div>
  <p class="cap">▲▼ variação contra a 1ª quinzena de agosto (${D.comparacao.inicio} a ${D.comparacao.fim}).
  ${D.canais.length > 1
    ? `Investimento${VENDAS() ? " e receita somam" : " soma"} os dois canais; as demais métricas aparecem separadas
       porque o Meta e o Google medem coisas diferentes e somá-las esconderia a comparação.`
    : `Esta conta veicula só no ${D.canais[0] === "meta" ? "Meta Ads" : "Google Ads"}.`}</p>`;
}

/* pílula de ROAS de uma base de comparação: verde se o período atual superou, âmbar se ficou abaixo */
function pilulaRoas(atual, base){
  if (base == null || !base) return `<span style="color:var(--ink-3)">—</span>`;
  const variacao = (atual - base) / base * 100;
  const cls = variacao >= 0 ? "up" : "down";
  const seta = variacao >= 0 ? "▲" : "▼";
  return `<span class="pilula ${cls}">${x(base)} <em>${seta} ${dec(Math.abs(variacao),1)}%</em></span>`;
}

/* as duas quinzenas equivalentes, lado a lado */
function linhaDoTempo(){
  const d = D;
  const cols = [
    {rot:"1ª quinzena de agosto", per:d.comparacao, v:d.consolidado_base},
    {rot:"1ª quinzena de setembro", per:d.periodo,  v:d.consolidado, atual:true}
  ];
  const linhas = [
    ["Investimento", v=>brl(v.gasto)],
    [RES(),          v=>dec(v.compras,1)],
    VENDAS() ? ["Receita", v=>brl(v.receita)] : null,
    VENDAS() ? ["Ticket médio", v=>brl(v.compras ? v.receita / v.compras : 0)] : null,
    [CUSTO_RES(),    v=>brl(v.cpa)],
    ["Cliques",      v=>int(v.cliques)],
    ["CTR",          v=>pc(v.ctr)]
  ].filter(Boolean);
  return `<div class="tabela-box"><table class="tempo">
    <thead><tr>
      <th></th>
      ${cols.map(c=>`<th class="num${c.atual?" agora":""}">${c.rot}<span class="sub">${c.per.inicio} a ${c.per.fim}</span></th>`).join("")}
    </tr></thead>
    <tbody>
      ${linhas.map(([rotulo,fmt])=>`<tr>
        <td class="esq">${rotulo}</td>
        ${cols.map((c,i)=>`<td class="num${c.atual?" agora":""}">${fmt(c.v,i)}</td>`).join("")}
      </tr>`).join("")}
      ${VENDAS() ? `<tr class="roas">
        <td><b>ROAS</b></td>
        ${cols.map(c=>`<td class="num${c.atual?" agora":""}">${
          c.atual ? `<b style="font-size:17px">${x(c.v.roas)}</b>`
                  : pilulaRoas(d.consolidado.roas, c.v.roas)}</td>`).join("")}
      </tr>` : ""}
    </tbody>
  </table></div>
  ${VENDAS() ? `<p class="cap">Na coluna de agosto, a pílula mostra o ROAS daquele período e o quanto setembro está
  acima (<span style="color:var(--bom)">verde</span>) ou abaixo (<span style="color:var(--alerta)">âmbar</span>) dele.</p>` : ""}`;
}

/* destaques — sempre um par por canal, para nenhum dos dois sumir da leitura */
function destaques(){
  const itens = [];

  D.canais.forEach(canal=>{
    const nomeCanal = canal === "meta" ? "Meta Ads" : "Google Ads";
    const cs = D[canal].campanhas;
    const unidade = RES1();
    const plural = RES().toLowerCase();

    const comResultado = cs.filter(c=>c.compras > 0 && c.gasto >= 100);
    const melhor = VENDAS()
      ? comResultado.slice().sort((a,b)=>b.roas-a.roas)[0]
      : comResultado.slice().sort((a,b)=>a.cpa-b.cpa)[0];
    if (melhor) itens.push([VENDAS() ? "Melhor retorno" : `Menor ${CUSTO_RES().toLowerCase()}`, nomeCanal,
      `<b>${melhor.nome}</b> — ${VENDAS() ? `${x(melhor.roas)} de ROAS` : `${brl(melhor.cpa)} por ${unidade}`}
       com ${brl(melhor.gasto)} investidos e ${dec(melhor.compras,melhor.compras%1?1:0)} ${plural}.`, "bom"]);

    /* maior perda de receita contra agosto — sem repetir a campanha já destacada como melhor retorno */
    const perda = cs.filter(c=>c.anterior && c !== melhor)
                    .map(c=>({c, dif: c.compras - c.anterior.compras}))
                    .sort((a,b)=>a.dif-b.dif)[0];
    if (perda && perda.dif < 0) itens.push(["Maior queda contra agosto", nomeCanal,
      `<b>${perda.c.nome}</b> — ${plural} de ${dec(perda.c.anterior.compras,perda.c.anterior.compras%1?1:0)}
       para ${dec(perda.c.compras,perda.c.compras%1?1:0)}${VENDAS()
         ? `, ${brl(Math.abs(perda.c.receita - perda.c.anterior.receita))} de receita a menos` : ""}.`, "ruim"]);
  });

  const queimando = (D.meta ? D.meta.criativos : []).filter(c=>c.compras === 0 && c.gasto >= 50);
  const queimado = queimando.reduce((s,c)=>s+c.gasto,0);
  if (queimando.length) itens.push(["Verba sem resultado", "Meta Ads",
    `${queimando.length} criativos somam <b>${brl(queimado)}</b> sem nenhum(a) ${RES1()} —
     ${dec(queimado / D.meta.kpis.gasto * 100,0)}% do investimento do canal.`, "alerta"]);

  const novas = D.canais.flatMap(c=>D[c].campanhas).filter(c=>c.selo === "novo");
  if (novas.length) itens.push(["Sem base de comparação", novas.length > 1 ? "Meta + Google" : "",
    `${novas.map(c=>`<b>${c.nome}</b> (${brl(c.gasto)})`).join(" e ")} não veicularam na 1ª quinzena de agosto,
     então não entram na comparação — leitura real só na próxima quinzena.`, "novo"]);

  const placar = D.canais.map(canal=>{
    const cs = D[canal].campanhas;
    const conta = s => cs.filter(c=>c.selo === s).length;
    const partes = [["melhorou","🟢"],["estavel","🟡"],["atencao","🔴"],["novo","🆕"]]
      .filter(([s])=>conta(s) > 0)
      .map(([s,e])=>`${e} ${conta(s)}`).join("&nbsp;&nbsp;");
    return `<div class="placar-item"><span class="placar-canal">${canal === "meta" ? "Meta Ads" : "Google Ads"}</span>
      <span class="placar-selos">${partes}</span>
      <span class="placar-n">${cs.length} ${cs.length === 1 ? "campanha" : "campanhas"}</span></div>`;
  }).join("");

  return `<div class="destaques">
    ${itens.map(([t,canal,txt,tom])=>`<div class="destaque ${tom}">
      <h3>${t}${canal?`<span class="canal">${canal}</span>`:""}</h3><p>${txt}</p></div>`).join("")}
  </div>
  <div class="placar">${placar}</div>`;
}

/* resumo do período — só descreve o que os números fizeram */
function resumoPeriodo(){
  const c = D.consolidado, b = D.consolidado_base;
  if (!c || !b) return "";
  const dif = campo => c.deltas && c.deltas[campo] != null ? c.deltas[campo] : null;
  const sobeDesce = v => v == null ? "" : (v > 0 ? "subiu " : "caiu ") + dec(Math.abs(v),1) + "%";
  const partes = [
    `Investimento ${brl(b.gasto)} → <b>${brl(c.gasto)}</b> (${sobeDesce(dif("gasto"))})`,
    `${RES()} ${dec(b.compras,1)} → <b>${dec(c.compras,1)}</b> (${sobeDesce(dif("compras"))})`,
    b.cpa && c.cpa ? `${CUSTO_RES()} ${brl(b.cpa)} → <b>${brl(c.cpa)}</b> (${sobeDesce(dif("cpa"))})` : null,
    VENDAS() ? `Receita ${brl(b.receita)} → <b>${brl(c.receita)}</b> (${sobeDesce(dif("receita"))})` : null,
    VENDAS() ? `ROAS ${x(b.roas)} → <b>${x(c.roas)}</b> (${sobeDesce(dif("roas"))})` : null,
  ].filter(Boolean);
  return `<div class="nota" style="margin-top:14px">
    <b>${D.periodo.inicio} a ${D.periodo.fim} contra ${D.comparacao.inicio} a ${D.comparacao.fim}.</b>
    ${partes.join(" · ")}.
  </div>`;
}

/* ---------- aba: meta ---------- */
function abaMeta(){
  const m = D.meta;
  const criativos = m.criativos.filter(c=>c.gasto >= 1)
    .slice().sort((a,b)=> b.compras - a.compras || b.gasto - a.gasto);

  /* eficiência = mais resultado pelo menor custo.
     Entra na disputa quem trouxe pelo menos 10% do resultado do canal — assim um criativo
     com 1 resultado barato não desbanca outro que sustentou o volume. */
  const totalRes = m.kpis.compras || 0;
  const minimo = Math.max(1, totalRes * 0.1);
  const ranking = criativos.filter(c=>c.compras >= minimo && c.cpa != null)
    .slice().sort((a,b)=> a.cpa - b.cpa || b.compras - a.compras);
  const melhorC = ranking[0], piorC = ranking[ranking.length - 1];
  const eficiencia = c => {
    if (!ranking.includes(c)) return "";
    if (c === melhorC) return "eficiente";
    if (c === piorC && ranking.length > 1) return "caro";
    return "medio";
  };
  const linhas = criativos.map(c=>{
    let tag = "";
    if (VENDAS() && c.compras > 0 && c.roas >= 10) tag = `<span class="tag bom">ROAS ≥ 10x</span>`;
    else if (c.gasto >= 50 && c.compras === 0) tag = `<span class="tag ruim">gasto ≥ R$ 50 · 0 ${RES1()}</span>`;
    else if (c.frequencia >= 5) tag = `<span class="tag alerta">frequência ≥ 5</span>`;
    return {
      cels:[
        `<b>${c.nome}</b>${tag}<span class="sub ${eficiencia(c)}">${c.campanha}</span>`,
        brl(c.gasto), int(c.impressoes), int(c.cliques), pc(c.ctr), dec(c.frequencia,2),
        dec(c.compras,0), brl(c.cpa), ...(VENDAS() ? [`<b>${x(c.roas)}</b>`] : [])
      ],
      vals:[c.nome, c.gasto, c.impressoes, c.cliques, c.ctr, c.frequencia,
            c.compras, c.cpa == null ? Infinity : c.cpa, c.roas]
    };
  });
  return `
  <div class="titulo-sec"><h2>Meta Ads — visão do canal</h2><p>Conta 1929564697284378 · ${D.periodo.inicio} a ${D.periodo.fim}</p></div>
  ${kpiGrid(m.kpis,[
    ["cliques","Cliques",int],["gasto","Custo",brl],
    ...(VENDAS() ? [["roas","ROAS de compras",x,true]] : []),
    ["cpa",CUSTO_RES(),brl,!VENDAS()],["ctr","CTR",pc],["frequencia","Frequência",v=>dec(v,2)],
    ["impressoes","Impressões",int],["compras",RES(),v=>dec(v,0)]
  ], m.base)}

  <div class="titulo-sec"><h2>Campanhas</h2><p>Ordenadas por investimento · conjuntos abertos quando há mais de um</p></div>
  ${legendaSelos}
  <div class="cards" style="margin-top:14px">
    ${m.campanhas.map(c=>cardCampanha(c,{
      chips:[rot(c.objetivo), c.conjuntos.length + (c.conjuntos.length===1?" conjunto":" conjuntos")],
      unidade:RES1(),
      metricas:[["cliques","Cliques",int],["gasto","Custo",brl],
                ...(VENDAS() ? [["roas","ROAS",x,true]] : []),
                ["compras",RES(),v=>dec(v,0)],["cpa",CUSTO_RES(),brl,!VENDAS()],
                ["ctr","CTR",pc],["frequencia","Frequência",v=>dec(v,2)],["impressoes","Impressões",int]]
    })).join("")}
  </div>

  <div class="titulo-sec"><h2>Criativos</h2><p>Todo anúncio com gasto no período · ordenado por ${RES().toLowerCase()} · clique em qualquer coluna para reordenar</p></div>
  <div class="legenda" style="margin-bottom:12px">
    <span><i style="background:var(--bom)"></i> Menor ${CUSTO_RES().toLowerCase()}</span>
    <span><i style="background:var(--alerta)"></i> Intermediário</span>
    <span><i style="background:var(--ruim)"></i> Maior ${CUSTO_RES().toLowerCase()}</span>
    <span>A cor fica no nome da campanha. Entram no ranking os criativos com pelo menos
    ${dec(minimo,1)} ${RES().toLowerCase()} no período (10% do total do canal).</span>
  </div>
  ${tabelaOrdenavel(["Criativo","Custo","Impressões","Cliques","CTR","Frequência",RES(),CUSTO_RES(),
                     ...(VENDAS() ? ["ROAS"] : [])], linhas, 6)}
  ${blocoPublicos()}`;
}

        <div class="card-tabela laranja" style="border-top:1px solid var(--laranja-rule)">
          <div class="ct-corpo" style="padding-top:14px">

/* palavras-chave e termos da campanha, renderizados dentro do card dela */
function blocoPesquisa(nomeCampanha){
  const g = D.google;
  const kws = g.keywords.filter(k=>k.campanha === nomeCampanha);
  const termos = g.termos.filter(t=>t.campanha === nomeCampanha);
  if (!kws.length && !termos.length) return "";

  const linhasKw = kws.map(k=>({
    cels:[
      `<b>${k.texto}</b><span class="sub">${k.match === "BROAD" ? "Ampla" : k.match === "EXACT" ? "Exata" : "Frase"} · Índice de qualidade ${k.qs ?? "—"}</span>`,
      brl(k.gasto), int(k.impressoes), int(k.cliques), pc(k.ctr),
      `<b>${dec(k.compras,1)}</b>`, k.cpa != null ? brl(k.cpa) : "—",
      ...(VENDAS() ? [brl(k.receita), `<b>${x(k.roas)}</b>`] : [])
    ],
    vals:[k.texto, k.gasto, k.impressoes, k.cliques, k.ctr, k.compras,
          k.cpa == null ? Infinity : k.cpa, k.receita, k.roas]
  }));
  const linhasTermos = termos.map(t=>{
    const perde = t.compras === 0 && t.gasto >= 5;  // gastou e não trouxe resultado
    return {
      cels:[
        `<b>${t.termo}</b>${perde?`<span class="tag ruim">sem ${RES1()}</span>`:""}`,
        brl(t.gasto), int(t.cliques), `<b>${dec(t.compras,1)}</b>`,
        ...(VENDAS() ? [brl(t.receita), t.compras ? x(t.roas) : "—"] : [])
      ],
      vals:[t.termo, t.gasto, t.cliques, t.compras, t.receita, t.roas]
    };
  });
  const gastoSemConversao = termos.filter(t=>!t.compras).reduce((s,t)=>s+t.gasto,0);

  return `
    ${kws.length ? `<details class="card-tabela">
      <summary class="ct-titulo"><i class="chev"></i>Palavras-chave <em>${kws.length} com gasto no período</em></summary>
      <div class="ct-corpo">
      ${tabelaOrdenavel(["Palavra-chave","Custo","Impressões","Cliques","CTR",RES(),CUSTO_RES(),
                ...(VENDAS() ? ["Receita","ROAS"] : [])], linhasKw, 5, "compacta")}
    </div></details>` : ""}
    ${termos.length ? `<details class="card-tabela">
      <summary class="ct-titulo"><i class="chev"></i>Termos de pesquisa <em>${termos.length} termos · o que o usuário digitou antes do clique</em></summary>
      <div class="ct-corpo">
      ${tabelaOrdenavel(["Termo","Custo","Cliques",RES(), ...(VENDAS() ? ["Receita","ROAS"] : [])], linhasTermos, 3, "compacta")}
      ${gastoSemConversao > 0 ? `<p class="ct-diagnostico">
        <b>${brl(gastoSemConversao)}</b> foram para termos sem ${RES1()}
        (${dec(gastoSemConversao / D.google.campanhas.find(c=>c.nome === nomeCampanha).gasto * 100,1)}% do custo da campanha)
        no período.</p>` : ""}
    </div></details>` : ""}`;
}

/* PMax não tem palavra-chave: a API entrega categorias de termos e os sinais do grupo de recursos */
function blocoPmax(c){
  const p = c.pmax;
  if (!p) return "";

  const grupos = p.grupos.length ? `<details class="card-tabela">
    <summary class="ct-titulo"><i class="chev"></i>Grupo de recursos <em>configuração atual da campanha</em></summary>
    <div class="ct-corpo">
    ${tabela(["Grupo","Status","Força do anúncio","Página de destino"],
      p.grupos.map(g=>[`<b>${g.nome}</b>`, g.status,
        `<span class="tag ${g.forca === "Excelente" || g.forca === "Boa" ? "bom" : g.forca === "Média" ? "alerta" : "ruim"}">${g.forca}</span>`,
        `<span class="ink3">${g.url}</span>`]), "compacta")}
  </div></details>` : "";

  const termos = p.termos.length ? `<details class="card-tabela azul">
    <summary class="ct-titulo"><i class="chev"></i>Categorias de termos de pesquisa <em>${p.termos.length} categorias · o que a PMax devolve no lugar de palavras-chave</em></summary>
    <div class="ct-corpo">
    ${tabelaOrdenavel(["Categoria de busca","Impressões","Cliques",RES(), ...(VENDAS() ? ["Receita"] : []), ""],
      p.termos.slice(0,15).map(t=>({
        cels:[`<b>${t.categoria}</b>`, int(t.impressoes), int(t.cliques), `<b>${dec(t.conversoes,1)}</b>`,
              ...(VENDAS() ? [brl(t.valor)] : []),
              t.conversoes ? "" : `<span class="tag ruim">0 ${RES1()}</span>`],
        vals:[t.categoria, t.impressoes, t.cliques, t.conversoes, t.valor, 0]
      })), 3, "compacta")}
    <p class="ct-diagnostico">
      ${p.termos.length > 15 ? `Mostrando as 15 categorias de maior volume, de ${p.termos.length} retornadas pela API. ` : ""}
      ${p.sem_categoria ? `Fora da tabela, a API devolve um bloco sem rótulo de categoria com
        <b>${int(p.sem_categoria.impressoes)}</b> impressões, ${int(p.sem_categoria.cliques)} cliques e
        ${dec(p.sem_categoria.conversoes,1)} ${RES().toLowerCase()} — o Google não revela a busca desses casos.` : ""}
    </p>
  </div></details>` : "";

  const sinais = (p.temas.length || p.publicos.length) ? `<details class="card-tabela azul">
    <summary class="ct-titulo"><i class="chev"></i>Sinais configurados <em>${p.temas.length} temas · ${p.publicos.length} público(s)</em></summary>
    <div class="ct-corpo">
    <div class="sinais-grid">
      <div>
        <div class="sg-rot">Temas de pesquisa <span>${p.temas.length}</span></div>
        <div class="sg-lista">${p.temas.map(t=>`<span class="pill">${t}</span>`).join("")}</div>
      </div>
      <div>
        <div class="sg-rot">Públicos-alvo <span>${p.publicos.length}</span></div>
        <div class="sg-lista">${p.publicos.length
          ? p.publicos.map(t=>`<span class="pill publico">${t}</span>`).join("")
          : `<span class="ink3">Nenhum público configurado como sinal</span>`}</div>
      </div>
    </div>
  </div></details>` : "";

  return grupos + termos + sinais;
}

function abaGoogle(){
  const g = D.google;
  const pausadas = g.pausadas.length ? `
    <div class="nota" style="margin-top:14px">
      <b>Fora do período.</b> ${g.pausadas.map(p=>`A campanha <b>${p.nome}</b> não gastou nesta quinzena (pausada). Na 1ª quinzena de agosto tinha consumido ${brl(p.gasto)} com ${dec(p.compras,0)} ${RES().toLowerCase()}${VENDAS() ? ` e ROAS de ${x(p.roas)}` : ""}.`).join(" ")}
    </div>` : "";
  return `
  <div class="titulo-sec"><h2>Google Ads — visão do canal</h2><p>Conta 888-218-9559 · MCC Açúcar · ${D.periodo.inicio} a ${D.periodo.fim}</p></div>
  ${kpiGrid(g.kpis,[
    ["cliques","Cliques",int],["gasto","Custo",brl],
    ...(VENDAS() ? [["roas","ROAS de compras",x,true]] : []),
    ["cpa",CUSTO_RES(),brl,!VENDAS()],["ctr","CTR",pc],["impressoes","Impressões",int],
    ["compras",RES(),v=>dec(v,1)],
    ...(VENDAS() ? [["receita","Receita",brl]] : [])
  ], g.base)}
  <div class="nota" style="margin-top:14px">
    Frequência não existe no Google Ads — é métrica exclusiva do Meta, por isso não aparece neste bloco.
  </div>

  <div class="titulo-sec"><h2>Campanhas</h2><p>Ordenadas por investimento · palavras-chave e termos aparecem dentro da campanha a que pertencem</p></div>
  ${legendaSelos}
  <div class="cards" style="margin-top:14px">
    ${g.campanhas.map(c=>cardCampanha(c,{
      chips:[rot(c.tipo), rot(c.lance)],
      unidade:RES1(),
      extra:blocoPesquisa(c.nome) + blocoPmax(c),
      metricas:[["cliques","Cliques",int],["gasto","Custo",brl],
                ...(VENDAS() ? [["roas","ROAS",x,true]] : []),
                ["compras",RES(),v=>dec(v,1)],["cpa",CUSTO_RES(),brl,!VENDAS()],
                ["ctr","CTR",pc],["impressoes","Impressões",int]]
    })).join("")}
  </div>
  ${pausadas}`;
}

/* ---------- montagem ---------- */
const ABAS = [
  ["geral","Visão geral",abaGeral],
  ["meta","Meta Ads",abaMeta],
  ["google","Google Ads",abaGoogle]
];

/* cliente em exibição */
let D = null;

function lembrar(chave, valor){ try { localStorage.setItem(chave, valor); } catch(e){} }
function lembrado(chave){ try { return localStorage.getItem(chave); } catch(e){ return null; } }

function montarClientes(){
  const barra = document.getElementById("clientes");
  barra.innerHTML = DADOS.ordem.map(slug=>{
    const c = DADOS.clientes[slug];
    return `<button class="cliente" type="button" role="tab" data-slug="${slug}" aria-selected="false">
      ${c.nome}<span class="canais">${c.canais.map(x=>x === "meta" ? "Meta" : "Google").join(" + ")}</span>
    </button>`;
  }).join("");
  barra.addEventListener("click", e=>{
    const b = e.target.closest("button.cliente");
    if (b) trocarCliente(b.dataset.slug);
  });
}

function trocarCliente(slug){
  D = DADOS.clientes[slug];
  lembrar("assucar-cliente", slug);

  document.querySelectorAll("#clientes .cliente").forEach(b=>
    b.setAttribute("aria-selected", String(b.dataset.slug === slug)));

  document.getElementById("eyebrow").textContent = "Relatório quinzenal de otimização";
  document.getElementById("titulo").textContent = D.nome;
  document.getElementById("periodo").innerHTML =
    `Período analisado <b>${D.periodo.inicio} a ${D.periodo.fim}</b> · comparado com a
     <b>1ª quinzena de agosto</b> (${D.comparacao.inicio} a ${D.comparacao.fim})`;
  document.getElementById("fontes").innerHTML = D.canais.map(c=>
    `<span class="fonte"><span class="dot"></span> ${c === "meta" ? "Meta Graph API" : "Google Ads API"}</span>`).join("");

  // abas existentes para este cliente
  const nav = document.getElementById("abas");
  nav.innerHTML = "";
  const visiveis = ABAS.filter(([id])=> id === "geral" || D.canais.includes(id));
  visiveis.forEach(([id,rotulo,render])=>{
    const b = document.createElement("button");
    b.className = "aba"; b.id = "aba-" + id; b.type = "button";
    b.setAttribute("role","tab");
    b.setAttribute("aria-controls","p-" + id);
    b.textContent = rotulo;
    b.addEventListener("click", ()=>selecionar(id));
    nav.appendChild(b);
    const painel = document.getElementById("p-" + id);
    painel.innerHTML = render();
  });
  ABAS.forEach(([id])=>{
    const painel = document.getElementById("p-" + id);
    if (!visiveis.some(([v])=>v === id)) painel.innerHTML = "";
  });

  const guardada = lembrado("assucar-aba");
  const inicial = visiveis.some(([id])=>id === guardada) ? guardada : visiveis[0][0];
  selecionar(inicial);

  document.getElementById("rodape").innerHTML =
    `Plus Digital Agência · ${D.nome} · dados puxados ao vivo da
     ${D.canais.map(c=>c === "meta" ? "Meta Graph API" : "Google Ads API").join(" e da ")} em ${DADOS.gerado_em}.<br>
     ${D.modo === "vendas"
       ? "Compras e receita do Meta usam o evento <i>purchase</i> do pixel; conversões do Google usam as ações de conversão da conta. ROAS = receita ÷ investimento no período."
       : `Esta conta não registra valor de conversão, então não há receita nem ROAS — o resultado é medido em ${D.resultado.toLowerCase()}, conforme as ações de conversão configuradas na própria conta.`}`;
}

function selecionar(id){
  ABAS.forEach(([outro])=>{
    const botao = document.getElementById("aba-" + outro);
    const painel = document.getElementById("p-" + outro);
    if (botao) botao.setAttribute("aria-selected", String(outro === id));
    if (painel) painel.hidden = outro !== id;
  });
  lembrar("assucar-aba", id);
}

montarClientes();
const salvo = lembrado("assucar-cliente");
trocarCliente(DADOS.clientes[salvo] ? salvo : DADOS.ordem[0]);
</script>
